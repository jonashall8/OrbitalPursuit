<!DOCTYPE html>
<html lang="en">
<head>

<title>OrbitalPursuit — Autonomous Satellite Servicing Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e0e0e0;font-family:'Courier New','Consolas',monospace;overflow:hidden}
#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%}

/* HUD base */
.hud{position:fixed;background:rgba(0,8,20,0.88);border:1px solid rgba(0,140,255,0.25);border-radius:6px;padding:12px 16px;font-size:12px;line-height:1.6;backdrop-filter:blur(8px);pointer-events:auto;z-index:10}
.hud h2{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#0af;margin-bottom:6px;border-bottom:1px solid rgba(0,140,255,0.15);padding-bottom:4px}
.label{color:#888;font-size:10px;text-transform:uppercase}
.value{color:#fff;font-size:13px;margin-bottom:4px}

/* Mission panel */
#hud-mission{top:14px;left:14px;width:340px}
.phase{font-size:18px;font-weight:bold;color:#0f0}
.status-msg{color:#aaa;margin-top:2px;font-size:11px}

/* Satellite list */
#hud-satellites{top:140px;left:14px;width:340px;max-height:calc(100vh - 430px);overflow-y:auto}
.sat-row{display:flex;align-items:center;padding:3px 2px;cursor:pointer;border-radius:3px;transition:background .15s}
.sat-row:hover{background:rgba(0,140,255,0.1)}
.sat-row.sel{background:rgba(0,200,255,0.15);border-left:2px solid #0af;padding-left:6px}
.sat-dot{width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}
.sat-name{width:80px;color:#ccc;font-size:11px}
.sat-stat{width:60px;font-size:10px}

/* Detail panel */
#hud-detail{top:14px;right:14px;width:260px;display:none}
.bar-outer{width:100%;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin:2px 0 6px}
.bar-inner{height:100%;border-radius:3px;transition:width .3s}

/* Servicer thermal */
#hud-servicer{bottom:60px;right:14px;width:250px}
.temp-bar{width:100%;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;margin:3px 0 5px}
.temp-fill{height:100%;border-radius:4px;transition:width .3s,background .3s}
@keyframes blink{50%{opacity:.3}}
.blink{animation:blink .8s infinite}

/* Decision panel */
#hud-decision{bottom:60px;left:14px;width:340px;max-height:200px;overflow-y:auto}
.score-row{display:flex;align-items:center;margin:2px 0;font-size:10px}
.score-bar{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin:0 6px}
.score-fill{height:100%;border-radius:2px}
.score-id{width:80px;color:#888}
.score-val{width:30px;text-align:right;color:#aaa}

/* Event log */
#hud-events{bottom:60px;left:360px;width:320px;max-height:200px}
#event-list{max-height:150px;overflow-y:auto;font-size:10px;line-height:1.5}
.evt{color:#888;border-left:2px solid #0a3a5a;padding-left:6px;margin:2px 0}
.evt .evt-time{color:#0af;margin-right:4px}

/* Controls */
#hud-controls{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.btn{background:rgba(0,140,255,0.12);border:1px solid rgba(0,140,255,0.35);color:#0af;padding:6px 14px;border-radius:4px;font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s}
.btn:hover{background:rgba(0,140,255,0.25);border-color:#0af}
.btn.on{background:rgba(0,200,100,0.15);border-color:#0c6;color:#0c6}

/* Telemetry chart */
#hud-chart{top:14px;left:360px;width:300px}
#chart-canvas{width:100%;border-radius:3px;background:rgba(0,4,12,0.6)}

/* Connection */
#conn{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(255,160,0,0.2);color:#fa0;border:1px solid rgba(255,160,0,0.3);z-index:20}
#conn.live{background:rgba(0,200,100,0.2);color:#0c6;border-color:rgba(0,200,100,0.3)}

/* PiP docking camera */
#pip-frame{position:fixed;bottom:270px;right:14px;width:240px;height:160px;border:1px solid rgba(0,255,100,0.3);border-radius:4px;overflow:hidden;display:none;z-index:15}
#pip-label{position:absolute;top:4px;left:8px;font-size:9px;color:#0f8;text-transform:uppercase;letter-spacing:1px;z-index:16}
#pip-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:16}

/* Tooltip */
#tooltip{position:fixed;background:rgba(0,8,20,0.95);border:1px solid #0af;padding:5px 8px;border-radius:4px;font-size:10px;pointer-events:none;display:none;z-index:100}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud" id="hud-mission">
    <h2>Mission Control</h2>
    <div class="phase" id="phase-display">MONITORING</div>

<div class="hud" id="hud-decision">

</div>

<div class="hud" id="hud-events">
    <h2>Event Log</h2>
    <div id="event-list"></div>
</div>

<div class="hud" id="hud-controls">
    <button class="btn" id="btn-pause">PAUSE</button>
    <button class="btn" id="btn-1x">1x</button>
    <button class="btn on" id="btn-10x">10x</button>
    <button class="btn" id="btn-50x">50x</button>

    <button class="btn on" id="btn-vf">FORMATION</button>
    <button class="btn" id="btn-vo">ORBITAL</button>
</div>

<div id="conn">DEMO MODE</div>
<div id="tooltip"></div>

<!-- PiP docking camera -->
<div id="pip-frame">
    <div id="pip-label">DOCKING CAM</div>
    <canvas id="pip-overlay"></canvas>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══ Config ════════════════════════════════════════════════════════
const S = 1/1000, N = 8, POLL = 150;
const VIEW_F = {p:[8,5,10],t:[0,0,0]};
const VIEW_O = {p:[0,35,50],t:[0,-12,0]};
const SC = {NOMINAL:0x00ff88,WARNING:0xffaa00,CRITICAL:0xff2200,OFFLINE:0x555555};

// ═══ Renderer ══════════════════════════════════════════════════════
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.01,5000);
const ren = new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setSize(innerWidth,innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.toneMapping = THREE.ACESFilmicToneMapping;
ren.autoClear = false;
document.getElementById('canvas-container').appendChild(ren.domElement);

cam.position.set(8,5,10);
const ctrl = new OrbitControls(cam,ren.domElement);
ctrl.enableDamping=true;ctrl.dampingFactor=0.08;ctrl.minDistance=1;ctrl.maxDistance=200;

// Docking PiP camera
const dockCam = new THREE.PerspectiveCamera(50,240/160,0.1,2000);

// ═══ Lighting ══════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x334466,0.5));
const sun = new THREE.DirectionalLight(0xffeedd,2);sun.position.set(50,30,40);scene.add(sun);
scene.add(new THREE.DirectionalLight(0x2244aa,0.3)).position.set(0,-30,0);

// Stars
const sg=new THREE.BufferGeometry(),sv=[];
for(let i=0;i<6000;i++)sv.push((Math.random()-.5)*2000,(Math.random()-.5)*2000,(Math.random()-.5)*2000);
sg.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.4})));

// ═══ Earth ═════════════════════════════════════════════════════════
function makeEarthTex(sz){
    const c=document.createElement('canvas');c.width=sz;c.height=sz/2;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,c.height);
    g.addColorStop(0,'#0a1a3a');g.addColorStop(.15,'#0d3060');g.addColorStop(.5,'#104080');g.addColorStop(.85,'#0d3060');g.addColorStop(1,'#0a1a3a');
    x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
    let s=42;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
    [{cx:.22,cy:.35,rx:.08,ry:.12},{cx:.25,cy:.6,rx:.04,ry:.10},{cx:.50,cy:.35,rx:.04,ry:.15},{cx:.52,cy:.60,rx:.05,ry:.08},{cx:.65,cy:.35,rx:.12,ry:.10},{cx:.72,cy:.30,rx:.08,ry:.06},{cx:.80,cy:.62,rx:.04,ry:.04}].forEach(ct=>{
        for(let k=0;k<8;k++){
            const ox=(r()-.5)*ct.rx*1.5,oy=(r()-.5)*ct.ry,srx=ct.rx*(.4+r()*.8),sry=ct.ry*(.4+r()*.8);
            x.beginPath();x.ellipse((ct.cx+ox)*c.width,(ct.cy+oy)*c.height,srx*c.width,sry*c.height,r()*Math.PI,0,Math.PI*2);
            x.fillStyle=`rgb(${40+r()*50|0},${80+r()*60|0},${20+r()*30|0})`;x.fill();
        }
    });
    // Poles
    const ig=x.createLinearGradient(0,0,0,c.height*.08);ig.addColorStop(0,'rgba(220,230,240,.9)');ig.addColorStop(1,'rgba(220,230,240,0)');x.fillStyle=ig;x.fillRect(0,0,c.width,c.height*.08);
    const ig2=x.createLinearGradient(0,c.height*.92,0,c.height);ig2.addColorStop(0,'rgba(220,230,240,0)');ig2.addColorStop(1,'rgba(220,230,240,.9)');x.fillStyle=ig2;x.fillRect(0,c.height*.92,c.width,c.height*.08);
    // Clouds
    x.globalAlpha=.1;for(let i=0;i<25;i++){const cx2=r()*c.width,cy2=r()*c.height,cr=20+r()*70;const cg=x.createRadialGradient(cx2,cy2,0,cx2,cy2,cr);cg.addColorStop(0,'rgba(255,255,255,.5)');cg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=cg;x.fillRect(cx2-cr,cy2-cr,cr*2,cr*2)}x.globalAlpha=1;
    return new THREE.CanvasTexture(c);
}
const ER=12,et=makeEarthTex(1024);et.wrapS=THREE.RepeatWrapping;
const earth=new THREE.Mesh(new THREE.SphereGeometry(ER,64,48),new THREE.MeshPhongMaterial({map:et,specular:0x222244,shininess:20,emissive:0x050a18,emissiveIntensity:.3}));
earth.position.set(0,-ER-12,0);earth.rotation.y=-.5;scene.add(earth);
for(let i=1;i<=3;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(ER+i*.15,48,48),new THREE.MeshBasicMaterial({color:0x4488ff,transparent:true,opacity:.04/i,side:THREE.BackSide,depthWrite:false}));m.position.copy(earth.position);scene.add(m)}
// Rim shader
const rim=new THREE.Mesh(new THREE.SphereGeometry(ER+.08,64,48),new THREE.ShaderMaterial({vertexShader:`varying vec3 vN,vP;void main(){vN=normalize(normalMatrix*normal);vP=(modelViewMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*vec4(vP,1.);}`,fragmentShader:`varying vec3 vN,vP;void main(){float r=1.-max(dot(normalize(-vP),vN),0.);r=pow(r,3.);gl_FragColor=vec4(.3,.6,1.,r*.6);}`,transparent:true,depthWrite:false}));
rim.position.copy(earth.position);scene.add(rim);
// Orbit ring
const oring=new THREE.Mesh(new THREE.TorusGeometry(14,.02,8,128),new THREE.MeshBasicMaterial({color:0x0a4488,transparent:true,opacity:.3}));
oring.position.copy(earth.position);oring.position.y+=ER+12;oring.rotation.x=Math.PI/2;scene.add(oring);
// Grid
const grid=new THREE.GridHelper(20,20,0x0a2a4a,0x051525);grid.position.y=-.5;grid.material.transparent=true;grid.material.opacity=.3;scene.add(grid);

// ═══ Satellites ════════════════════════════════════════════════════
const sM=[],sG=[],sGrp=new THREE.Group();scene.add(sGrp);
for(let i=0;i<N;i++){
    const m=new THREE.Mesh(new THREE.OctahedronGeometry(.15,0),new THREE.MeshPhongMaterial({color:0x00ff88,emissive:0x004422}));
    m.userData.sid=i;sGrp.add(m);sM.push(m);
    const pg=new THREE.BoxGeometry(.5,.02,.12),pm=new THREE.MeshPhongMaterial({color:0x1a1a5a,emissive:0x0a0a3a});
    m.add(new THREE.Mesh(pg,pm)).position.x=-.3;m.add(new THREE.Mesh(pg,pm.clone())).position.x=.3;
    const gl=new THREE.PointLight(0x00ff88,.3,2);m.add(gl);sG.push(gl);
}

// Keep-out zone wireframes
const koMeshes=[];
const koGeo=new THREE.SphereGeometry(200*S,16,12);
for(let i=0;i<N;i++){
    const m=new THREE.Mesh(koGeo,new THREE.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:0,wireframe:true,depthWrite:false}));
    scene.add(m);koMeshes.push(m);
}

// Servicer
const svc=new THREE.Mesh(new THREE.ConeGeometry(.12,.35,6),new THREE.MeshPhongMaterial({color:0xffcc00,emissive:0x554400}));
svc.rotation.x=Math.PI;scene.add(svc);
const svcGl=new THREE.PointLight(0xff6600,0,1.5);svc.add(svcGl);

// Trail
const TL=150,tP=new Float32Array(TL*3),tGeo=new THREE.BufferGeometry();
tGeo.setAttribute('position',new THREE.BufferAttribute(tP,3));
const trail=new THREE.Line(tGeo,new THREE.LineBasicMaterial({color:0xff8800,transparent:true,opacity:.4}));
scene.add(trail);let tI=0;

// Trajectory prediction line
const TMAX=60;
const trajPosArr=new Float32Array(TMAX*3);
const trajColArr=new Float32Array(TMAX*3);
const trajGeo=new THREE.BufferGeometry();
trajGeo.setAttribute('position',new THREE.BufferAttribute(trajPosArr,3));
trajGeo.setAttribute('color',new THREE.BufferAttribute(trajColArr,3));
const trajLine=new THREE.Line(trajGeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.8}));
scene.add(trajLine);

// ═══ State ═════════════════════════════════════════════════════════
let D=null,selId=-1,live=false,paused=false,spd=10,demoT=0,view='f';
let camAnim=false,camFrom={},camTo={},camT=0;

// Chart history
const chartHist={};
const CHART_MAX=200;

// ═══ Demo data ═════════════════════════════════════════════════════
function demoData(t){
    const sats=[];
    for(let i=0;i<N;i++){
        const a=(2*Math.PI*i)/N,R=5000;
        const px=R*Math.cos(a)*.3,py=R*Math.sin(a),pz=R*Math.cos(a+Math.PI/4)*.2;
        const bt=50+i*4+Math.sin(t*.02+i)*8,spike=(i===5&&t>30)?Math.min((t-30)*.5,35):0;
        const gt=bt+spike,re=Math.max(.3,1-i*.06-t*.0002),fu=Math.max(0,10-i*.5-t*.002),lo=Math.min(1,.6+i*.04+t*.001);
        let st='NOMINAL';if(gt>=90||fu<1)st='CRITICAL';else if(gt>=75||fu<3||re<.5)st='WARNING';
        let u=0;if(gt>75)u+=100*((gt-75)/25)**2;if(fu<3)u+=50*(1-fu/3);
        sats.push({id:i,name:'COMPUTE-'+i,pos:[px,py,pz],vel:[0,0,0],att:[1,0,0,0],gpu_temp:gt,radiator_eff:re,fuel:fu,compute_load:lo,solar_power:4083,power_draw:200+lo*2400,in_eclipse:Math.sin(t*.05+i*.8)>.7,status:st,urgency:u});
    }
    let tid=-1,mu=5;sats.forEach(s=>{if(s.urgency>mu){mu=s.urgency;tid=s.id}});
    const pk=[0,-10000,0];let sp=pk,ph='MONITORING',sm='Monitoring...',pr=0;
    if(tid>=0){const tg=sats[tid],ap=Math.min(1,Math.max(0,(t-20)/40));
        sp=[pk[0]+(tg.pos[0]-pk[0])*ap,pk[1]+(tg.pos[1]-pk[1])*ap,pk[2]+(tg.pos[2]-pk[2])*ap];
        if(ap<.3){ph='TRANSIT';sm=`Transit to ${tg.name} | Range: ${((1-ap/.3)*10000)|0}m`}
        else if(ap<.8){ph='RENDEZVOUS';sm='Proximity ops...'}
        else if(ap<.95){ph='DOCKING';sm='Final approach...'}
        else{ph='SERVICING';sm='Servicing '+((Math.min(1,(t-58)/20)*100)|0)+'%'}
    }
    // Demo trajectory
    const traj=[];if(tid>=0&&ph==='TRANSIT'){
        const tg=sats[tid];for(let i=0;i<40;i++){const f=i/40;
            traj.push([sp[0]+(tg.pos[0]-sp[0])*f+Math.sin(f*3)*200,sp[1]+(tg.pos[1]-sp[1])*f+Math.cos(f*2.5)*150,sp[2]+(tg.pos[2]-sp[2])*f+Math.sin(f*4)*100]);
        }
    }
    // Demo scores
    const scores=sats.map(s=>({id:s.id,temp:s.gpu_temp>75?100*((s.gpu_temp-75)/25)**2:0,fuel:s.fuel<3?50*(1-s.fuel/3):0,rad:s.radiator_eff<.6?30*(1-s.radiator_eff):0,time:0,total:s.urgency}));
    const reason=tid>=0?`COMPUTE-${tid}: thermal(${scores[tid].temp|0}) + fuel(${scores[tid].fuel|0}) + rad(${scores[tid].rad|0}) = ${scores[tid].total|0}`:'No urgent targets';
    const events=[{t:t-10,msg:'System monitoring active'},{t:t-5,msg:tid>=0?`Target COMPUTE-${tid} selected`:'All nominal'}];
    return{sim_time:t,pi_cpu_temp:42+Math.sin(t*.1)*5,mission:{phase:ph,target_id:tid,mission_time:t,phase_progress:pr,status:sm},servicer:{pos:sp,vel:[0,0,0],att:[1,0,0,0],fuel:50-t*.05,target_id:tid},satellites:sats,trajectory:traj,decision:{scores,reason},events};
}

// ═══ Telemetry polling ═════════════════════════════════════════════
async function poll(){try{const r=await fetch('telemetry.json?t='+Date.now());if(r.ok){D=await r.json();if(!live){live=true;document.getElementById('conn').textContent='LIVE — C++ ENGINE';document.getElementById('conn').className='live'}}}catch{live=false;document.getElementById('conn').textContent='DEMO MODE';document.getElementById('conn').className=''}}
setInterval(poll,POLL);poll();

// ═══ Chart ═════════════════════════════════════════════════════════
const chartCvs=document.getElementById('chart-canvas');
const chartCtx=chartCvs.getContext('2d');

function addChartPt(id,val){if(!chartHist[id])chartHist[id]=[];chartHist[id].push(val);if(chartHist[id].length>CHART_MAX)chartHist[id].shift()}

function drawChart(){
    const w=chartCvs.width,h=chartCvs.height;
    chartCtx.fillStyle='rgba(0,4,12,0.85)';chartCtx.fillRect(0,0,w,h);
    // Grid
    chartCtx.strokeStyle='rgba(0,140,255,0.08)';chartCtx.lineWidth=1;
    for(let i=0;i<5;i++){const y=(i/4)*h;chartCtx.beginPath();chartCtx.moveTo(0,y);chartCtx.lineTo(w,y);chartCtx.stroke()}
    // Y labels
    chartCtx.fillStyle='#446';chartCtx.font='8px monospace';
    chartCtx.fillText('100C',2,10);chartCtx.fillText('50C',2,h/2);chartCtx.fillText('0C',2,h-2);
    // Warning line at 75C
    chartCtx.strokeStyle='rgba(255,170,0,0.3)';chartCtx.setLineDash([4,4]);
    chartCtx.beginPath();chartCtx.moveTo(0,h*.25);chartCtx.lineTo(w,h*.25);chartCtx.stroke();
    chartCtx.setLineDash([]);
    // Critical line at 90C
    chartCtx.strokeStyle='rgba(255,34,0,0.3)';chartCtx.setLineDash([4,4]);
    chartCtx.beginPath();chartCtx.moveTo(0,h*.1);chartCtx.lineTo(w,h*.1);chartCtx.stroke();
    chartCtx.setLineDash([]);
    // Series
    const colors=['#00ff88','#ffaa00','#ff2200','#0af','#a0f','#ff0','#0ff','#f0f'];
    for(let id=0;id<N;id++){
        const d=chartHist['t'+id];if(!d||d.length<2)continue;
        chartCtx.strokeStyle=colors[id%colors.length];chartCtx.lineWidth=1;chartCtx.globalAlpha=.7;
        chartCtx.beginPath();
        for(let i=0;i<d.length;i++){
            const x=(i/(CHART_MAX-1))*w,y=h-(d[i]/100)*h;
            i===0?chartCtx.moveTo(x,y):chartCtx.lineTo(x,y);
        }
        chartCtx.stroke();
    }
    chartCtx.globalAlpha=1;
}

// ═══ Pi thermal effect ═════════════════════════════════════════════
function piEffect(t){
    if(t<0)return{s:1,th:1,st:'No data',c:'#666'};
    if(t<55)return{s:1,th:1,st:'Nominal',c:'#0f8'};
    if(t<65){const r=(t-55)/10;return{s:1-r*.1,th:1,st:'Warm',c:'#ff0'}}
    if(t<75){const r=(t-65)/10;return{s:.9-r*.2,th:.9-r*.15,st:'THERMAL WARN',c:'#f80'}}
    const r=Math.min(1,(t-75)/5);return{s:.7-r*.3,th:.75-r*.25,st:'THROTTLE',c:'#f22'};
}

// ═══ HUD ═══════════════════════════════════════════════════════════
function updateHUD(d){
    if(!d)return;
    const pe=document.getElementById('phase-display');pe.textContent=d.mission.phase;
    pe.style.color=d.mission.phase==='SERVICING'?'#ff0':d.mission.phase==='MONITORING'?'#0f0':'#0af';
    document.getElementById('status-msg').textContent=d.mission.status;
    document.getElementById('sim-time').textContent=(d.sim_time|0)+'s';
    document.getElementById('svc-fuel').textContent=(d.servicer.fuel|0)+'kg';

    // Pi temp
    const pt=d.pi_cpu_temp,pe2=piEffect(pt);
    document.getElementById('pi-temp-val').textContent=pt>=0?pt.toFixed(1)+' C':'--';
    document.getElementById('pi-temp-val').style.color=pe2.c;
    const pb=document.getElementById('pi-temp-bar');pb.style.width=Math.min(100,pt>=0?(pt/80)*100:0)+'%';pb.style.background=pe2.c;
    const ps=document.getElementById('pi-status');ps.textContent=pe2.st;ps.style.color=pe2.c;ps.className=pt>=75?'blink':'';
    document.getElementById('svc-spd').textContent=(pe2.s*100|0)+'%';document.getElementById('svc-spd').style.color=pe2.c;
    document.getElementById('svc-thr').textContent=(pe2.th*100|0)+'%';document.getElementById('svc-thr').style.color=pe2.c;

    // Satellite list
    let lh='';d.satellites.forEach(s=>{
        const c=SC[s.status]||0x555555,h='#'+c.toString(16).padStart(6,'0'),sl=s.id===selId?' sel':'';
        lh+=`<div class="sat-row${sl}" data-id="${s.id}"><div class="sat-dot" style="background:${h}"></div><span class="sat-name">${s.name}</span><span class="sat-stat" style="color:${h}">${s.status}</span><span class="sat-stat">${s.gpu_temp|0}C</span><span class="sat-stat">${s.fuel.toFixed(1)}kg</span></div>`;
    });
    document.getElementById('sat-list').innerHTML=lh;
    document.querySelectorAll('.sat-row').forEach(r=>r.addEventListener('click',()=>{selId=parseInt(r.dataset.id)}));

    // Detail
    if(selId>=0){const s=d.satellites.find(x=>x.id===selId);if(s){
        document.getElementById('hud-detail').style.display='block';
        const tc=s.gpu_temp>90?'#f22':s.gpu_temp>75?'#fa0':'#0f8';
        document.getElementById('detail-content').innerHTML=`
            <div style="font-size:14px;color:#fff;margin-bottom:6px">${s.name}</div>
            <div class="label">GPU Temp</div><div class="value" style="color:${tc}">${s.gpu_temp.toFixed(1)}C</div>
            <div class="bar-outer"><div class="bar-inner" style="width:${Math.min(100,s.gpu_temp)}%;background:${tc}"></div></div>
            <div class="label">Fuel</div><div class="value">${s.fuel.toFixed(1)}kg</div>
            <div class="bar-outer"><div class="bar-inner" style="width:${(s.fuel/10)*100}%;background:#0af"></div></div>
            <div class="label">Radiator</div><div class="value">${(s.radiator_eff*100).toFixed(0)}%</div>
            <div class="bar-outer"><div class="bar-inner" style="width:${s.radiator_eff*100}%;background:#a0f"></div></div>
            <div class="label">Load</div><div class="value">${(s.compute_load*100).toFixed(0)}%</div>
            <div class="bar-outer"><div class="bar-inner" style="width:${s.compute_load*100}%;background:#ff0"></div></div>
            <div class="label">Power</div><div class="value">${s.power_draw|0}W / ${s.solar_power|0}W ${s.in_eclipse?'(ECLIPSE)':''}</div>`;
    }}else{document.getElementById('hud-detail').style.display='none'}

    // Decision reasoning
    if(d.decision){
        document.getElementById('decision-reason').textContent=d.decision.reason||'—';
        let sh='';const mx=Math.max(1,...(d.decision.scores||[]).map(s=>s.total));
        (d.decision.scores||[]).forEach(s=>{
            const pct=mx>0?(s.total/mx)*100:0;
            const c=s.total>50?'#f22':s.total>10?'#fa0':'#0f8';
            sh+=`<div class="score-row"><span class="score-id">C-${s.id}</span><div class="score-bar"><div class="score-fill" style="width:${pct}%;background:${c}"></div></div><span class="score-val">${s.total|0}</span></div>`;
        });
        document.getElementById('decision-scores').innerHTML=sh;
    }

    // Events
    if(d.events&&d.events.length){
        let eh='';d.events.slice(-12).reverse().forEach(e=>{
            eh+=`<div class="evt"><span class="evt-time">${(e.t|0)}s</span>${e.msg}</div>`;
        });
        document.getElementById('event-list').innerHTML=eh;
    }

    // Chart data
    d.satellites.forEach(s=>addChartPt('t'+s.id,s.gpu_temp));
    drawChart();
}

// ═══ 3D update ═════════════════════════════════════════════════════
function updateScene(d){
    if(!d)return;
    d.satellites.forEach((s,i)=>{
        if(i>=sM.length)return;const m=sM[i],g=sG[i];
        m.position.set(s.pos[0]*S,s.pos[2]*S,s.pos[1]*S);
        m.rotation.y+=.005;m.rotation.x+=.002;
        const c=SC[s.status]||0x555555;m.material.color.setHex(c);m.material.emissive.setHex(c).multiplyScalar(.3);
        g.color.setHex(c);g.intensity=s.status==='CRITICAL'?.8:.3;
        if(s.status==='CRITICAL')m.scale.setScalar(1+.1*Math.sin(Date.now()*.008));else m.scale.setScalar(1);
        if(s.id===selId)m.scale.multiplyScalar(1.25);
        m.children.forEach(ch=>{if(ch.isMesh)ch.material.emissive.setHex(s.in_eclipse?0:0x0a0a3a)});
        // Keep-out zone
        if(i<koMeshes.length){
            koMeshes[i].position.copy(m.position);
            const svcDist=svc.position.distanceTo(m.position);
            const show=svcDist<3&&d.servicer.target_id!==i;
            koMeshes[i].material.opacity=show?Math.max(0,(.15-svcDist*.02)):0;
        }
    });

    // Servicer
    const sv=d.servicer;
    svc.position.set(sv.pos[0]*S,sv.pos[2]*S,sv.pos[1]*S);
    const svcSpd=Math.sqrt(sv.vel[0]**2+sv.vel[1]**2+sv.vel[2]**2);
    svcGl.intensity=Math.min(2,svcSpd*.1);
    if(sv.target_id>=0&&sv.target_id<sM.length)svc.lookAt(sM[sv.target_id].position);

    // Trail
    const ti=tI%TL;tP[ti*3]=svc.position.x;tP[ti*3+1]=svc.position.y;tP[ti*3+2]=svc.position.z;tI++;
    tGeo.attributes.position.needsUpdate=true;

    // Trajectory prediction arc
    const traj=d.trajectory||[];
    const tc=Math.min(traj.length,TMAX);
    for(let i=0;i<tc;i++){
        trajPosArr[i*3]=traj[i][0]*S;trajPosArr[i*3+1]=traj[i][2]*S;trajPosArr[i*3+2]=traj[i][1]*S;
        const f=1-i/tc;
        trajColArr[i*3]=.2+f*.3;trajColArr[i*3+1]=.5+f*.5;trajColArr[i*3+2]=1;
    }
    // Zero out unused
    for(let i=tc;i<TMAX;i++){trajPosArr[i*3]=trajPosArr[i*3+1]=trajPosArr[i*3+2]=0;trajColArr[i*3]=trajColArr[i*3+1]=trajColArr[i*3+2]=0}
    trajGeo.attributes.position.needsUpdate=true;
    trajGeo.attributes.color.needsUpdate=true;
    trajGeo.setDrawRange(0,tc);

    // Docking PiP camera
    const showPip=d.mission.phase==='RENDEZVOUS'||d.mission.phase==='DOCKING';
    document.getElementById('pip-frame').style.display=showPip?'block':'none';
    if(showPip&&sv.target_id>=0&&sv.target_id<sM.length){
        dockCam.position.copy(svc.position);
        dockCam.lookAt(sM[sv.target_id].position);
        // Draw crosshair on PiP overlay
        const oc=document.getElementById('pip-overlay');
        oc.width=240;oc.height=160;
        const ox=oc.getContext('2d');
        ox.clearRect(0,0,240,160);
        ox.strokeStyle='rgba(0,255,100,0.4)';ox.lineWidth=1;
        ox.beginPath();ox.moveTo(120,60);ox.lineTo(120,100);ox.stroke();
        ox.beginPath();ox.moveTo(100,80);ox.lineTo(140,80);ox.stroke();
        ox.beginPath();ox.arc(120,80,20,0,Math.PI*2);ox.stroke();
        // Range display
        const range=svc.position.distanceTo(sM[sv.target_id].position)/S;
        ox.fillStyle='#0f8';ox.font='10px monospace';
        ox.fillText(`RNG: ${(range).toFixed(0)}m`,8,150);
        ox.fillText(`SPD: ${svcSpd.toFixed(2)}m/s`,140,150);
    }

    earth.rotation.y+=.0005;
}

// ═══ Camera animation ══════════════════════════════════════════════
function animCam(p,t){camFrom={p:cam.position.clone(),t:ctrl.target.clone()};camTo={p:new THREE.Vector3(...p),t:new THREE.Vector3(...t)};camT=0;camAnim=true}
function updCam(dt){if(!camAnim)return;camT+=dt/1.5;if(camT>=1){camT=1;camAnim=false}const e=camT<.5?2*camT*camT:1-(-2*camT+2)**2/2;cam.position.lerpVectors(camFrom.p,camTo.p,e);ctrl.target.lerpVectors(camFrom.t,camTo.t,e)}

// ═══ Raycasting ════════════════════════════════════════════════════
const rc=new THREE.Raycaster(),ms=new THREE.Vector2();
ren.domElement.addEventListener('click',e=>{
    ms.x=(e.clientX/innerWidth)*2-1;ms.y=-(e.clientY/innerHeight)*2+1;
    rc.setFromCamera(ms,cam);const h=rc.intersectObjects(sM,true);
    if(h.length){let o=h[0].object;while(o&&o.userData.sid===undefined)o=o.parent;if(o)selId=o.userData.sid}else selId=-1;
});
ren.domElement.addEventListener('mousemove',e=>{
    ms.x=(e.clientX/innerWidth)*2-1;ms.y=-(e.clientY/innerHeight)*2+1;
    rc.setFromCamera(ms,cam);const h=rc.intersectObjects(sM,true);
    const tip=document.getElementById('tooltip');
    if(h.length&&D){let o=h[0].object;while(o&&o.userData.sid===undefined)o=o.parent;
        if(o&&o.userData.sid!==undefined){const s=D.satellites[o.userData.sid];if(s){tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';tip.innerHTML=`<b>${s.name}</b> [${s.status}]<br>Temp:${s.gpu_temp|0}C | Fuel:${s.fuel.toFixed(1)}kg`}}}else tip.style.display='none';
});

// ═══ Controls ══════════════════════════════════════════════════════
document.getElementById('btn-pause').addEventListener('click',()=>{paused=!paused;document.getElementById('btn-pause').textContent=paused?'PLAY':'PAUSE'});
[1,10,50].forEach(s=>{document.getElementById('btn-'+s+'x').addEventListener('click',()=>{spd=s;document.querySelectorAll('#hud-controls .btn').forEach(b=>b.classList.remove('on'));document.getElementById('btn-'+s+'x').classList.add('on')})});
document.getElementById('btn-vf').addEventListener('click',()=>{view='f';animCam(VIEW_F.p,VIEW_F.t);document.getElementById('btn-vf').classList.add('on');document.getElementById('btn-vo').classList.remove('on');grid.visible=true});
document.getElementById('btn-vo').addEventListener('click',()=>{view='o';animCam(VIEW_O.p,VIEW_O.t);document.getElementById('btn-vo').classList.add('on');document.getElementById('btn-vf').classList.remove('on');grid.visible=false});
document.getElementById('btn-service').addEventListener('click',()=>{if(selId>=0)console.log('Dispatch to',selId)});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

// ═══ Render loop ═══════════════════════════════════════════════════
const clk=new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const dt=clk.getDelta();
    updCam(dt);ctrl.update();
    if(!live){if(!paused)demoT+=dt*spd;D=demoData(demoT)}
    if(D){updateScene(D);updateHUD(D)}

    // Main render
    ren.setViewport(0,0,innerWidth,innerHeight);
    ren.setScissor(0,0,innerWidth,innerHeight);
    ren.setScissorTest(false);
    ren.clear();
    ren.render(scene,cam);

    // PiP docking camera
    const pipEl=document.getElementById('pip-frame');
    if(pipEl.style.display==='block'){
        const pw=240,ph=160;
        const px=innerWidth-pw-14;
        const py=innerHeight-270-ph;
        ren.setViewport(px,py,pw,ph);
        ren.setScissor(px,py,pw,ph);
        ren.setScissorTest(true);
        ren.render(scene,dockCam);
        ren.setScissorTest(false);
    }
}
animate();
</script>
